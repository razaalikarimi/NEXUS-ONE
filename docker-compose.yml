services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexusone
      POSTGRES_PASSWORD: nexusone_dev
      POSTGRES_DB: nexusone_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusone -d nexusone_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexusone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
